[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sextant-core"
version = "1.1.0"
description = "OSIPI-ready 1D and 2D (b, TE) relaxation-compensated IVIM-DWI fitting, boundary-railing diagnostics, multi-core NIfTI volume processing, calibration utilities, and synthetic phantoms."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [
    { name = "Avery Karlin", email = "ak5232@columbia.edu" }
]
keywords = [
    "IVIM",
    "DWI",
    "diffusion MRI",
    "diffusion-relaxation",
    "OSIPI",
    "bi-exponential fitting",
    "boundary-railing",
    "uncertainty quantification",
    "calibration",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
]

[project.scripts]
sextant-ivim = "sextant_core.cli:main"

[project.urls]
Homepage = "https://github.com/akarlin3/sextantIVIM"
Repository = "https://github.com/akarlin3/sextantIVIM"

[project.optional-dependencies]
nifti = [
    "nibabel>=5.0",
]
vis = [
    "matplotlib>=3.6",
]
all = [
    "nibabel>=5.0",
    "matplotlib>=3.6",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
    "build>=1.0",
    "jupyter>=1.0",
    "nibabel>=5.0",
    "matplotlib>=3.6",
]
test = [
    "pytest>=7.0",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sextant_core*"]

[tool.setuptools.package-data]
sextant_core = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 110
src = ["src", "tests", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "E402"]
